name: ${name}
version: ${version}
main: ${main}
api-version: "${apiVersion}"
# The update check runs on Paper's async/global-region schedulers and every
# command touches only its caller's thread, so the plugin is safe on Folia.
folia-supported: true
author: ${author}
description: ${description}
website: ${website}
# Paper's loader ignores Bukkit's legacy softdepend key (and without a declared
# relationship PlaceholderAPI's classes are invisible to this plugin), so the
# optional dependency is declared here: load after PAPI when it is present and
# join its classpath so the expansion classes resolve.
dependencies:
  server:
    PlaceholderAPI:
      load: AFTER
      required: false
      join-classpath: true
permissions:
  jgamemode.use:
    description: Switch gamemodes (master switch; also needs the scope and mode permissions).
    default: op
  jgamemode.use.survival:
    description: Switch to survival.
    default: true
  jgamemode.use.creative:
    description: Switch to creative.
    default: true
  jgamemode.use.adventure:
    description: Switch to adventure.
    default: true
  jgamemode.use.spectator:
    description: Switch to spectator.
    default: true
  jgamemode.self:
    description: Switch your own gamemode (needs jgamemode.use).
    default: true
  jgamemode.other:
    description: Switch other players' gamemode (needs jgamemode.use).
    default: op
  jgamemode.reload:
    description: Reload the JGameMode configuration.
    default: op
  jgamemode.help:
    description: View the JGameMode help listing.
    default: true
  jgamemode.version:
    description: View the JGameMode version.
    default: true
