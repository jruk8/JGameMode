site_name: JGameMode
site_description: Modern 26.x plugin for /gm s and /gmc.
site_url: https://jruk8.github.io/JGameMode/
repo_url: https://github.com/jruk8/JGameMode
repo_name: GitHub

theme:
  variant: modern
  language: en
  custom_dir: overrides
  logo: assets/jgamemode-icon-darkmode.png
  favicon: assets/jgamemode-favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Commands: commands.md
  - Permissions: permissions.md
  - Configuration: configuration.md
  - Placeholders: placeholders.md
  - Plugin API for developers: api.md

extra:
  logo_light: assets/jgamemode-icon-lightmode.png
  # No generator backlink in the footer (SEO: no third-party links).
  generator: false
